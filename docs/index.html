<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BroadLink Hub for Homebridge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Documentation for BroadLink Hub, the Homebridge plugin for BroadLink RM remotes: setup, learning codes, every accessory option, and developer reference.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <style>
    :root { --theme-color: #6a3fc1; --sidebar-width: 17rem; }
    .markdown-section { max-width: 920px; }
    .markdown-section img { border: 1px solid rgba(127,127,127,.25); border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.12); margin: .4rem 0 1rem; max-width: 100%; }
    .markdown-section img.small { max-width: 360px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section td code, .markdown-section th code { white-space: nowrap; }
    .badge { display: inline-block; font-size: .72rem; font-weight: 600; padding: .1rem .5rem; border-radius: 1rem; vertical-align: middle; margin-left: .3rem; }
    .badge.user { background: #e3f6e8; color: #1b7a39; }
    .badge.adv { background: #fff2d9; color: #8a5a00; }
    .badge.dev { background: #e6eefc; color: #1f4ea8; }
    .persona-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; margin: 1rem 0 1.5rem; }
    .persona { border: 1px solid rgba(127,127,127,.25); border-radius: 10px; padding: 1rem 1.1rem; }
    .persona h3 { margin: 0 0 .4rem !important; }
    .persona p { margin: .3rem 0 !important; }
    .sidebar-nav > ul > li > p { font-weight: 700; margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'BroadLink Hub',
      repo: 'https://github.com/pirates-killer/homebridge-broadlink-hub',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      maxLevel: 4,
      search: { placeholder: 'Search the docs', noData: 'No results', depth: 3 },
      copyCode: { buttonText: 'Copy', successText: 'Copied' },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.0/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
</body>
</html>
